name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

env:
  PYTHON_VERSION: '3.13'
  # Nothing here uses a GPU. The default PyPI Linux torch wheel bundles CUDA and
  # runs to several GB; the CPU index keeps installs and the image a fraction of
  # that size.
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
  IMAGE: ghcr.io/dhruvalshah2051/rag-wikipedia-eval

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url "$TORCH_CPU_INDEX"
          pip install -r requirements-dev.txt

      - name: Importable without an API key
        # rag_pipeline used to build its Groq client at import time, which made
        # every import fail wherever GROQ_API_KEY was absent. Guard that.
        run: python -c "import rag_pipeline, grading, chunking, schema"

      - name: Run unit tests
        run: pytest -m "not integration" -v

  integration:
    name: Integration tests (pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: rag_project
      DB_USER: postgres
      DB_PASSWORD: postgres
      # The integration tests skip themselves when no database is reachable,
      # which would let a broken service container report success. This turns
      # that skip into a failure here, where a database is guaranteed.
      RAG_REQUIRE_DB: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url "$TORCH_CPU_INDEX"
          pip install -r requirements-dev.txt

      # The integration tests run the real embedding model, so the weights are
      # cached rather than re-downloaded from Hugging Face on every run.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Run integration tests
        # RAG_REQUIRE_DB (set above) makes an unreachable database a failure
        # rather than a skip. -ra additionally surfaces any other skip in the
        # log, so a quietly-not-running test cannot hide behind a green check.
        run: pytest -m integration -v -ra

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [unit]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only main publishes. Branches and pull requests build the image to prove
      # the Dockerfile is valid, then throw it away.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          # Image names must be lowercase, so these are written out rather than
          # interpolated from github.repository, which carries capitals here.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
